<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/src/assets/bird%20in%20hand%20ring%20logo.png" />
    <title>Greenfingers Wildlife Initiative</title>
    <style>
      @font-face {
        font-family: 'Rainbow Theory';
        src: url('/fonts/Rainbow%20Theory.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Moonlit Flow';
        src: url('/fonts/MoonlitFlow-Regular.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Kenvior';
        src: url('/fonts/Kenvior-Medium.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Modern Sans';
        src: url('/fonts/ModernSans-Light.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Skreeble';
        src: url('/fonts/Skreeble%20demo.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      html, body, #root {
        margin: 0;
        height: 100%;
      }

      body {
        font-family: 'Rainbow Theory', sans-serif;
        overflow-x: hidden;
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      img, svg {
        max-width: 100%;
      }

      .freeform-button {
        max-width: 100%;
        text-align: center;
        white-space: normal;
        transform-origin: center;
        transition: transform .22s cubic-bezier(.2, .8, .2, 1), filter .22s ease;
      }

      .freeform-button:hover {
        transform: translateY(-5px) scale(1.03);
        filter: none;
      }

      .freeform-button:active {
        transform: translateY(2px) rotate(0) scale(.98);
      }

      .motion-reveal {
        opacity: 0;
        transform: translateY(34px) scale(.975);
        transition: opacity .65s ease var(--reveal-delay, 0ms), transform .75s cubic-bezier(.2, .78, .22, 1) var(--reveal-delay, 0ms);
        will-change: opacity, transform;
      }

      .motion-reveal.motion-visible {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      @keyframes headerEntrance {
        from { opacity: 0; transform: translateY(-24px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes gentleBob {
        0%, 100% { transform: translateY(0) rotate(0); }
        50% { transform: translateY(-5px) rotate(1.5deg); }
      }

      @keyframes shellBob {
        0%, 100% { transform: translateY(0) rotate(25deg); }
        50% { transform: translateY(-5px) rotate(20deg); }
      }

      .site-header {
        animation: headerEntrance .7s cubic-bezier(.2, .8, .2, 1) both;
      }

      .hero-star {
        animation: gentleBob 4.5s ease-in-out infinite;
      }

      .hero-shell {
        animation: shellBob 5s ease-in-out infinite;
      }

      .home-hero-title {
        position: relative;
      }

      .hero-line {
        position: relative;
        display: inline-block;
      }

      .hero-decoration {
        position: absolute;
        z-index: 1;
        display: block;
        width: clamp(64px, 7vw, 90px);
        height: clamp(64px, 7vw, 90px);
        object-fit: contain;
        pointer-events: none;
      }

      .hero-star {
        top: -34px;
        left: -58px;
      }

      .hero-shell {
        right: -66px;
        bottom: 0;
        transform: rotate(25deg);
      }

      .contact-page {
        min-height: 100vh;
        color: #000000;
        background: #FDF8DF;
        overflow-x: hidden;
      }

      .contact-layout {
        width: min(760px, calc(100% - 64px));
        margin: 70px auto 120px;
        box-shadow: 10px 12px 0 #000000;
      }

      .contact-details,
      .contact-form-panel {
        padding: clamp(48px, 6vw, 78px);
      }

      .contact-details {
        color: #ffffff;
        background: #1C1C1C;
      }

      .contact-kicker,
      .contact-form-heading > span {
        font-family: 'Modern Sans';
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      .contact-kicker {
        margin: 0 0 12px;
        color: #F69524;
      }

      .contact-details > h1 {
        margin: 0;
        color: #ffffff;
        font-family: 'Skreeble';
        font-size: clamp(62px, 7vw, 96px);
        font-weight: normal;
        line-height: .9;
      }

      .contact-intro {
        max-width: 440px;
        margin: 25px 0 45px;
        font-family: 'Modern Sans';
        font-size: 17px;
        font-weight: bold;
        line-height: 1.6;
      }

      .contact-info-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 32px 34px;
      }

      .contact-info-group h2 {
        margin: 0 0 10px;
        color: #B2D235;
        font-family: 'Skreeble';
        font-size: 34px;
        font-weight: normal;
        line-height: 1;
      }

      .contact-info-group a,
      .contact-info-group p,
      .contact-info-group address {
        display: block;
        margin: 4px 0;
        color: #ffffff;
        font-family: 'Modern Sans';
        font-size: 15px;
        font-style: normal;
        font-weight: bold;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }

      .contact-info-group a:hover {
        color: #F69524;
      }

      .contact-form-panel {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 620px;
        background: #ffffff;
      }

      .contact-form-heading > span {
        color: #000000;
      }

      .contact-form-heading h2 {
        margin: 8px 0 12px;
        color: #009a2e;
        font-family: 'Skreeble';
        font-size: clamp(48px, 5vw, 68px);
        font-weight: normal;
        line-height: .95;
      }

      .contact-form-heading p,
      .contact-form label > span,
      .contact-form-note {
        font-family: 'Modern Sans';
        font-weight: bold;
      }

      .contact-form-heading p {
        margin: 0 0 30px;
        font-size: 16px;
        line-height: 1.5;
      }

      .contact-form,
      .contact-form label {
        display: flex;
        flex-direction: column;
      }

      .contact-form {
        gap: 20px;
      }

      .contact-form-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }

      .contact-form label {
        gap: 7px;
      }

      .contact-form label > span {
        font-size: 14px;
      }

      .contact-form small {
        font-size: 12px;
      }

      .contact-form input,
      .contact-form select,
      .contact-form textarea {
        width: 100%;
        min-height: 50px;
        padding: 13px 15px;
        color: #000000;
        background: #FDF8DF;
        border: 2px solid #000000;
        border-radius: 0;
        font-family: 'Modern Sans';
        font-size: 16px;
        font-weight: bold;
        transition: border-color .2s ease, background-color .2s ease, transform .2s ease, box-shadow .2s ease;
      }

      .contact-form input:hover,
      .contact-form select:hover,
      .contact-form textarea:hover {
        border-color: #000000;
        transform: translateY(-2px);
        box-shadow: 0 4px 0 rgba(0, 0, 0, .12);
      }

      .contact-form textarea {
        min-height: 145px;
        resize: vertical;
      }

      .contact-form input:focus,
      .contact-form select:focus,
      .contact-form textarea:focus {
        border-color: #000000;
        outline: 3px solid rgba(0, 0, 0, .15);
      }

      .contact-submit {
        align-self: flex-start;
        min-width: 175px;
        margin-top: 6px;
        padding: 16px 28px;
        color: #000000;
        background: #B2D235;
        border: 0;
        box-shadow: 0 7px 0 #000000;
        font-family: 'Modern Sans';
        font-size: 16px;
        font-weight: bold;
        transform-origin: center;
        transition: transform .22s cubic-bezier(.2, .8, .2, 1), box-shadow .22s ease, background-color .22s ease;
      }

      .contact-submit:hover {
        background: #B2D235;
        transform: translateY(-5px) scale(1.03);
        box-shadow: 0 11px 0 #000000;
      }

      .contact-submit:active {
        transform: translateY(3px) scale(.98);
        box-shadow: 0 3px 0 #000000;
      }

      .contact-form-note {
        margin: 5px 0 0;
        color: #009a2e;
        font-size: 14px;
      }

      .site-footer {
        position: relative;
        z-index: 20;
        overflow: visible;
        isolation: isolate;
      }

      .footer-grid,
      .footer-logo {
        position: relative;
        z-index: 2;
        overflow: visible;
      }

      .safari-divider {
        position: relative;
        z-index: 1;
      }

      .sponsor-strip {
        position: relative;
        z-index: 2;
        width: 100%;
        padding: 30px 0 36px;
        background: #ffffff;
        overflow: hidden;
      }

      .sponsor-strip-label {
        margin: 0 0 20px;
        color: #1C1C1C;
        font-family: 'Modern Sans';
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 1.6px;
        text-align: center;
        text-transform: uppercase;
      }

      .sponsor-marquee {
        width: 100%;
        overflow: hidden;
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent);
        mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent);
      }

      .sponsor-track {
        display: flex;
        width: max-content;
        animation: sponsorScroll 42s linear infinite;
        will-change: transform;
      }

      .sponsor-logo-group {
        display: flex;
        align-items: center;
        gap: 66px;
        padding-right: 66px;
      }

      .sponsor-logo-item {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 190px;
        width: 190px;
        height: 112px;
        padding: 8px;
      }

      .sponsor-logo-item img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      @keyframes sponsorScroll {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }

      * {
        cursor: none;
      }

      .custom-cursor {
        position: fixed;
        top: 0;
        left: 0;
        width: 32px;
        height: 32px;
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%) scale(1);
        transition: transform 0.2s ease;
        will-change: transform;
      }

      .custom-cursor.cursor-small {
        transform: translate(-50%, -50%) scale(0.55);
      }

      .nav-link {
        display: inline-block;
        color: #000000;
        font-size: 50px;
        text-decoration: none;
        transform-origin: bottom center;
        transition: transform 0.2s ease, color 0.2s ease;
      }

      .nav-link:hover {
        transform: scale(1.2);
        color: #F69524;
      }

      .site-header {
        position: relative;
        z-index: 1000;
        width: 100%;
        padding-top: 38px;
      }

      .mobile-header-row {
        display: flex;
        justify-content: center;
        align-items: center;
        padding-inline: 24px;
      }

      .header-logo-link {
        display: inline-flex;
        line-height: 0;
      }

      .header-logo {
        display: block;
        width: auto;
        height: 70px;
      }

      .menu-toggle {
        display: none;
      }

      .site-nav {
        display: flex;
        justify-content: center;
        margin-top: 20px;
      }

      .site-nav-inner {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
      }

      .site-nav-row,
      .nav-links {
        display: flex;
        align-items: center;
      }

      .site-nav-row {
        gap: 20px;
      }

      .nav-links {
        gap: 60px;
      }

      .nav-doodle {
        flex-shrink: 0;
        overflow: visible;
      }

      .nav-underline {
        margin-top: 10px;
      }

      .about-choice-card,
      .portfolio-card {
        transform-origin: center;
        transition: transform .24s cubic-bezier(.2, .8, .2, 1), filter .24s ease;
      }

      .about-choice-card:hover,
      .portfolio-card:hover {
        transform: translateY(-10px) scale(1.035);
        filter: drop-shadow(0 13px 0 #000000) brightness(1.06) !important;
      }

      .about-choice-card:active,
      .portfolio-card:active {
        transform: translateY(2px) scale(.985);
        filter: drop-shadow(0 4px 0 #000000) !important;
      }

      .about-choice-card:focus-visible {
        transform: translateY(-10px) scale(1.035);
        outline: 3px solid #000000;
        outline-offset: 6px;
      }

      @media (max-width: 1200px) {
        .site-nav {
          width: 100%;
          padding-inline: 24px;
        }

        .site-nav-inner,
        .site-nav-row {
          width: 100%;
        }

        .site-nav-row {
          justify-content: center;
        }

        .nav-links {
          gap: clamp(22px, 4vw, 50px) !important;
        }

        .nav-link {
          font-size: clamp(31px, 4vw, 46px) !important;
        }

        .home-hero-title span {
          font-size: clamp(68px, 8vw, 100px) !important;
        }

        .footer-grid {
          padding-inline: 40px !important;
        }
      }

          margin-top: 16px !important;
          padding-inline: 20px;
        }

          display: none;
        }

        .nav-links {
          width: 100%;
          justify-content: center;
          flex-wrap: wrap;
          column-gap: 30px !important;
          row-gap: 4px !important;
        }

        .nav-link {
          font-size: 34px !important;
        }

        .nav-underline {
          width: min(680px, 100%) !important;
        }

        .home-page {
          min-height: 100vh !important;

        .home-hero {
          padding-inline: 24px;
        }

        .home-hero-title {
          margin-top: 72px !important;

        }

        .home-hero-title span {
          font-size: clamp(53px, 9vw, 76px) !important;
        }

        .hero-decoration {
          width: clamp(50px, 8vw, 68px);
          height: clamp(50px, 8vw, 68px);
        }

        .hero-star {
          top: -24px;
          left: -44px;
        }

        .hero-shell {
          right: -49px;
          bottom: 0;
        }

        .home-intro {
          padding-inline: 24px;
        }

        .stats-grid {
          gap: 35px 50px !important;
        }

        .doodle-stat {
          flex: 0 1 130px;
        }

        .home-feature {
          max-width: 720px !important;
          gap: 36px !important;
          margin-inline: 32px !important;
        }

        .home-feature-title {
          font-size: 50px !important;
        }

        .home-feature-image {

        }

        .footer-grid > p {

        }

        }

        .safari-divider {
          height: clamp(220px, 44vw, 360px) !important;
          -webkit-mask-size: 101% auto !important;
          mask-size: 101% auto !important;

          mask-position: center bottom !important;

          margin-bottom: -35px !important;
        }
      }

      @media (max-width: 640px) {

          padding-inline: 14px;
        }

        .nav-links {
          column-gap: 20px !important;
          row-gap: 2px !important;
        }

        .nav-link {
          font-size: clamp(25px, 7.5vw, 32px) !important;
        }

        .nav-link:hover {
          transform: scale(1.08);
        }

        .home-logo-wrap {
          margin-top: 32px !important;
          padding-inline: 20px;
        }

        .home-logo,
        .footer-logo {
          width: min(280px, 78vw);

        }

        }

          margin-top: 52px !important;

        }

          height: clamp(28px, 9vw, 40px);
        }

          top: -13px;
          left: -23px;
        }

        .hero-shell {
          right: -27px;
          bottom: 0;
        }

          font-size: clamp(38px, 12vw, 58px) !important;
        }

        }

        }

        .home-feature-reverse {

        }

        }

        .site-header.menu-open {
          z-index: 10000;
        }

        .site-header.menu-open::before {
          content: '';
          position: fixed;
          inset: 0;
          z-index: 99;
          display: block;
          background: #1C1C1C;
          opacity: 1;
        }

        .mobile-header-row {
          position: relative;
          z-index: 2;
          justify-content: center;
          gap: var(--mobile-menu-gap);
          width: 100%;
          min-height: 76px;
          padding: 14px 16px;
          background: #FDF8DF;
        }

        .header-logo {
          width: min(190px, 58vw);
          height: auto;
          max-height: 48px;
          object-fit: contain;
          object-position: left center;
        }

        .menu-toggle {
          display: flex;
          justify-content: center;
          align-items: center;
          flex: 0 0 42px;
          width: 42px;
          height: 42px;
          margin-left: 0;
          padding: 0;
          color: #000000;
          background: transparent;
          border: 0;
          border-radius: 0;
          -webkit-tap-highlight-color: transparent;
          transition: transform .22s cubic-bezier(.2, .8, .2, 1), filter .22s ease;
        }

        .menu-toggle:hover {
          transform: translateY(-4px) scale(1.03);
          filter: none;
        }

        .menu-toggle:active {
          transform: translateY(1px) scale(.94);
        }

        .menu-toggle:focus,
        .menu-toggle:focus-visible,
        .header-logo-link:focus,
        .header-logo-link:focus-visible {
          outline: none !important;
          box-shadow: none !important;
        }

        .menu-icon {
          display: block;
          width: 38.76px;
          height: 38.76px;
          object-fit: contain;
          mix-blend-mode: multiply;
          transition: transform .22s ease;
        }

        .site-nav {
          position: fixed;
          top: 0;
          left: 0;
          z-index: 100;
          display: block;
          width: 100%;
          height: 100vh;
          height: 100dvh;
          margin: 0 !important;
          padding: 0 !important;
          color: #ffffff;
          background-color: #1C1C1C !important;
          overflow-y: auto;
          opacity: 1 !important;
          isolation: isolate;
          transform: translateX(100%);
          visibility: hidden;
          transition: transform .32s cubic-bezier(.22, .8, .25, 1), visibility .32s;
        }

        .menu-open .site-nav {
          transform: translateX(0);
          visibility: visible;
        }

        .menu-open .mobile-header-row {
          position: fixed;
          top: 0;
          left: 0;
          z-index: 101;
          width: 100%;
          background: #1C1C1C;
        }

        .menu-open .header-logo {
          filter: brightness(0) invert(1);
        }

        .menu-open .menu-toggle {
          color: #ffffff;
        }

        .menu-open .menu-icon {
          filter: invert(1);
          mix-blend-mode: screen;
          transform: none;
        }

        .site-nav-inner {
          width: 100%;
          height: 100%;
          min-height: 100%;
        }

        .site-nav-row {
          width: 100%;
          height: 100%;
          min-height: 100%;
          justify-content: center;
          padding: 76px 24px 20px;
        }

        .nav-links {
          flex-direction: column;
          flex-wrap: nowrap;
          align-items: flex-start;
          width: min(
            calc(100% - 32px),
            calc(min(190px, 58vw) + var(--mobile-menu-gap) + 42px)
          );
          gap: 5px !important;
        }

        .nav-link {
          width: 100%;
          padding: 8px 0;
          color: #ffffff;
          font-size: clamp(32px, 10vw, 43px) !important;
          line-height: 1;
          -webkit-tap-highlight-color: transparent;
        }

        .nav-link:hover,
        .nav-link:focus-visible {
          color: #ffffff;
          transform: translateX(7px);
        }

        .nav-link:focus-visible {
          outline: 2px solid #ffffff;
          outline-offset: 3px;
        }

        .nav-doodle,
        .nav-underline {
          display: none;
        }
      }

      @media (hover: none), (pointer: coarse) {
        * {
          cursor: auto;
        }

        .custom-cursor {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      @keyframes floatA {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(14px, -16px) rotate(4deg); }
      }

      @keyframes floatB {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(-16px, 12px) rotate(-4deg); }
      }

      @keyframes floatC {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(10px, 16px) rotate(3deg); }
      }

      .float-a {
        animation-name: floatA;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
      }

      .float-b {
        animation-name: floatB;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
      }

      .float-c {
        animation-name: floatC;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
