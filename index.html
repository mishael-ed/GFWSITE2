<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenfingers Wildlife Initiative</title>
    <style>
      @font-face {
        font-family: 'Rainbow Theory';
        src: url('/fonts/Rainbow%20Theory.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Moonlit Flow';
        src: url('/fonts/MoonlitFlow-Regular.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Kenvior';
        src: url('/fonts/Kenvior-Medium.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Modern Sans';
        src: url('/fonts/ModernSans-Light.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Skreeble';
        src: url('/fonts/Skreeble%20demo.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      html, body, #root {
        margin: 0;
        height: 100%;
      }

      body {
        font-family: 'Rainbow Theory', sans-serif;
      }

      * {
        cursor: none;
      }

      .custom-cursor {
        position: fixed;
        top: 0;
        left: 0;
        width: 32px;
        height: 32px;
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%) scale(1);
        transition: transform 0.2s ease;
        will-change: transform;
      }

      .custom-cursor.cursor-small {
        transform: translate(-50%, -50%) scale(0.55);
      }

      .nav-link {
        display: inline-block;
        color: #000000;
        transform-origin: bottom center;
        transition: transform 0.2s ease, color 0.2s ease;
      }

      .nav-link:hover {
        transform: scale(1.2);
        color: #F69524;
      }

      @keyframes floatA {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(14px, -16px) rotate(4deg); }
      }

      @keyframes floatB {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(-16px, 12px) rotate(-4deg); }
      }

      @keyframes floatC {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(10px, 16px) rotate(3deg); }
      }

      .float-a {
        animation-name: floatA;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
      }

      .float-b {
        animation-name: floatB;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
      }

      .float-c {
        animation-name: floatC;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
